name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --require-hashes -r requirements-test.lock
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -m "not browser" --cov --cov-report=term-missing --cov-fail-under=95
      - run: git diff --check

  rocky-sqlite:
    runs-on: ubuntu-latest
    container: rockylinux/rockylinux:9
    steps:
      - uses: actions/checkout@v4
      - run: dnf install -y epel-release
      - run: dnf install -y python3.13 python3.13-pip sqlite poppler-utils
      - run: python3.13 -m pip install --require-hashes -r requirements.lock
      - run: python3.13 -m pip install --require-hashes -r requirements-test.lock
      - run: python3.13 -m pytest -m "not browser"

  browser-webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --require-hashes -r requirements-test.lock
      - run: python -m playwright install --with-deps webkit
      - run: pytest -m browser

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --require-hashes -r requirements-test.lock
      - run: pip check
      - run: pytest -m security
      - run: "! git grep -En '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|ghp_[A-Za-z0-9]{20,})'"

  ci-gate:
    if: always()
    needs: [quality-unit, rocky-sqlite, browser-webkit, security]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: test "$RESULTS" = "success success success success"
