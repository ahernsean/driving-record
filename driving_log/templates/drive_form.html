{% extends "base.html" %}
{% block content %}
  <h1>{{ title }}</h1>
  <form class="stacked-form" method="post" action="{{ action }}" data-form-action="{{ form_action }}">
    <input type="hidden" name="form_token" value="{{ token(form_action) }}">
    <input type="hidden" name="request_id" value="{{ '10000000-0000-4000-8000-' ~ range(100000000000,999999999999)|random }}">
    {% if drive %}<input type="hidden" name="version" value="{{ drive.version }}">{% endif %}
    <label>Start
      <input required type="datetime-local" name="started_at_local" value="{{ start_local }}">
    </label>
    <label>DST occurrence (only when the start time repeats)
      <select name="start_fold">
        <option value="">Not repeated</option><option value="0">First occurrence</option><option value="1">Second occurrence</option>
      </select>
    </label>
    <label>End
      <input required type="datetime-local" name="ended_at_local" value="{{ end_local }}">
    </label>
    <label>DST occurrence (only when the end time repeats)
      <select name="end_fold">
        <option value="">Not repeated</option><option value="0">First occurrence</option><option value="1">Second occurrence</option>
      </select>
    </label>
    <label>Driver
      <input required name="driver_name" value="{{ drive.driver_name if drive else 'Daniel Ahern' }}">
    </label>
    <label>Supervising driver
      <input name="supervisor_name" value="{{ drive.supervisor_name if drive and drive.supervisor_name else 'Sean Ahern' }}">
    </label>
    <div class="two-column">
      <label>Supervisor license
        <input name="supervisor_dl_number" autocomplete="off" value="{{ drive.supervisor_dl_number if drive and drive.supervisor_dl_number else '' }}">
      </label>
      <label>State
        <input name="supervisor_dl_state" maxlength="2" value="{{ drive.supervisor_dl_state if drive and drive.supervisor_dl_state else '' }}">
      </label>
    </div>
    <p class="field-note">License details are optional, but required before DMV submission.</p>
    <fieldset>
      <legend>Road type</legend>
      {% for kind in ("local", "highway", "mixed", "unknown") %}
        <label class="choice"><input type="radio" name="road_type" value="{{ kind }}" {{ "checked" if (drive and drive.road_type == kind) or (not drive and kind == "unknown") }}> {{ kind | title }}</label>
      {% endfor %}
    </fieldset>
    <label>Weather
      <input name="weather" value="{{ drive.weather if drive else '' }}">
    </label>
    <label>Notes
      <textarea name="notes" rows="3">{{ drive.notes if drive else '' }}</textarea>
    </label>
    <button class="primary" type="submit">Save drive</button>
  </form>
{% endblock %}
