{% extends "base.html" %}
{% block content %}
  <h1>Full-state archives</h1>
  <form method="post" action="/archives">
    <input type="hidden" name="form_token" value="{{ token('archive.create') }}">
    <button class="primary" type="submit">Create verified archive</button>
  </form>
  <div class="drive-list">
    {% for archive in archives %}<article class="drive-row"><strong>{{ archive.name }}</strong></article>
    {% else %}<p class="empty">No archives yet.</p>{% endfor %}
  </div>
{% endblock %}
