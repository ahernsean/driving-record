{% extends "base.html" %}
{% block content %}
  <h1>Full-state archives</h1>
  <form method="post" action="/archives" data-async-submit>
    <button class="primary" type="submit">Create verified archive</button>
  </form>
  <div class="drive-list">
    {% for archive in archives %}<article class="drive-row"><strong>Verified archive</strong><small>{{ format_local_datetime(archive.created_at) }}</small></article>
    {% else %}<p class="empty">No archives yet.</p>{% endfor %}
  </div>
{% endblock %}
